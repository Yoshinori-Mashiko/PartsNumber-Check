<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123c65">
<title>部品ラベル照合アプリ</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
padding: 12px;
font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
background: #f0f3f7;
color: #172638;
max-width: 600px;
margin-left: auto;
margin-right: auto;
}

h1 {
text-align: center;
font-size: 20px;
margin: 4px 0 10px;
}

.panel {
background: white;
border-radius: 12px;
padding: 12px;
margin-bottom: 10px;
box-shadow: 0 2px 6px #00000010;
}

#cameraArea {
position: relative;
overflow: hidden;
background: #101820;
border-radius: 10px;
height: 200px;
}

video {
width: 100%;
height: 100%;
object-fit: cover;
}

.guide {
position: absolute;
left: 10%;
width: 80%;
top: 40%;
height: 20%;
border: 3px solid #35e07c;
border-radius: 8px;
pointer-events: none;
}

.guideText {
position: absolute;
left: 0;
right: 0;
top: 10%;
color: white;
text-align: center;
text-shadow: 0 1px 4px black;
font-size: 12px;
pointer-events: none;
}

#status {
text-align: center;
font-weight: bold;
font-size: 14px;
padding: 6px 0;
color: #145da0;
}

.button-group {
display: flex;
gap: 8px;
margin-top: 6px;
}

button {
flex: 1;
border: none;
border-radius: 8px;
padding: 10px;
font-size: 15px;
font-weight: bold;
cursor: pointer;
}

button:disabled {
opacity: .4;
}

.primary { color: white; background: #145da0; }
.secondary { color: #17334e; background: #dfe8f1; }
.danger { color: white; background: #b42318; }

.comparison-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-bottom: 8px;
}

.sub-panel {
background: #f8fafc;
border-radius: 8px;
padding: 8px;
border: 1px solid #e2e8f0;
}

.label {
color: #607080;
font-size: 11px;
margin-bottom: 2px;
}

.number {
font-size: 16px;
font-weight: bold;
overflow-wrap: anywhere;
min-height: 22px;
}

#result {
text-align: center;
font-size: 26px;
font-weight: 900;
padding: 12px;
border-radius: 10px;
background: #e5eaf0;
color: #334155;
margin-bottom: 8px;
}

#result.match { background: #d8f7e2; color: #08752d; }
#result.mismatch { background: #ffe0e0; color: #bd1717; }
#result.waiting { background: #fff2cc; color: #805b00; }

.small {
color: #64748b;
font-size: 11px;
line-height: 1.4;
}

details {
font-size: 12px;
color: #64748b;
}

summary {
cursor: pointer;
font-weight: bold;
}

#log {
font-size: 11px;
line-height: 1.4;
white-space: pre-wrap;
overflow-wrap: anywhere;
max-height: 80px;
overflow-y: auto;
background: #f1f5f9;
padding: 6px;
border-radius: 6px;
margin-top: 4px;
}
</style>
</head>

<body>

<h1>部品ラベル照合</h1>

<div class="panel" style="padding: 10px;">
<div id="cameraArea">
<video id="video" autoplay playsinline muted></video>
<div class="guide"></div>
<div class="guideText">品番を緑枠に合わせてください</div>
</div>

<div id="status">カメラを起動してください</div>

<div class="button-group">
<button id="startBtn" class="primary">カメラ起動</button>
<button id="stopBtn" class="secondary" disabled>停止</button>
<button id="resetBtn" class="danger">リセット</button>
</div>
</div>

<div class="panel">
<div class="comparison-grid">
<div class="sub-panel">
<div class="label">1枚目・基準品番</div>
<div id="reference" class="number">未登録</div>
</div>
<div class="sub-panel">
<div class="label">2枚目・照合品番</div>
<div id="current" class="number">未読み取り</div>
</div>
</div>

<div id="result" class="waiting">照合待ち</div>

<details>
<summary>使い方・ログを表示</summary>
<p class="small" style="margin-top: 6px;">
①「カメラ起動」を押し、1枚目を緑枠に合わせる。<br>
② 登録されたら1枚目を外し、2枚目を合わせると自動照合します。
</p>
<div id="log">履歴なし</div>
</details>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
"use strict";

const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const resetBtn = document.getElementById("resetBtn");
const statusEl = document.getElementById("status");
const referenceEl = document.getElementById("reference");
const currentEl = document.getElementById("current");
const resultEl = document.getElementById("result");
const logEl = document.getElementById("log");

let stream = null;
let worker = null;
let running = false;
let processing = false;
let timer = null;

let referenceCode = "";
let currentCode = "";
let candidateCode = "";
let candidateCount = 0;
let emptyCount = 0;
let waitingForSecond = false;
let secondCandidate = "";
let secondCount = 0;

const REQUIRED_COUNT = 3;
const REQUIRED_EMPTY_COUNT = 2;
const SCAN_INTERVAL = 900;

const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

function setStatus(message) {
statusEl.textContent = message;
}

function normalizeCode(text) {
// 全角英数やハイフンなどを綺麗に整えるが、文字の種類は限定しない
return text
.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
.replace(/[－‐‑‒–—―−ー]/g, "-")
.replace(/\s+/g, "") // 空白を削除
.trim();
}

function validCode(code) {
// 文字数が5文字以上であれば有効とする（条件を緩く変更）
return code.length >= 5;
}

function showResult(type, message) {
resultEl.className = type;
resultEl.textContent = message;
}

function addLog(message) {
const time = new Date().toLocaleTimeString("ja-JP");
logEl.textContent = time + " " + message + "\n" + logEl.textContent;
}

function clearCandidates() {
candidateCode = "";
candidateCount = 0;
secondCandidate = "";
secondCount = 0;
}

function resetAll() {
referenceCode = "";
currentCode = "";
waitingForSecond = false;
emptyCount = 0;
clearCandidates();

referenceEl.textContent = "未登録";
currentEl.textContent = "未読み取り";
showResult("waiting", "照合待ち");
setStatus(running ? "1枚目のラベルを読み取ってください" : "カメラを起動してください");
addLog("リセットしました");
}

async function startCamera() {
if (running) return;

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
setStatus("カメラを利用できません。HTTPSで開いてください。");
return;
}

if (!window.Tesseract) {
setStatus("OCRエンジンを読み込めません。");
return;
}

startBtn.disabled = true;
setStatus("カメラを準備中...");

try {
stream = await navigator.mediaDevices.getUserMedia({
audio: false,
video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
});

video.srcObject = stream;
await video.play();

setStatus("文字認識エンジンを準備中...");

worker = await Tesseract.createWorker("eng");
await worker.setParameters({
// ホワイトリスト（文字制限）を完全に削除して、どんな文字も読めるように変更
preserve_interword_spaces: "0",
tessedit_pageseg_mode: "4"
});

running = true;
stopBtn.disabled = false;
startBtn.disabled = true;

resetAll();
setStatus("1枚目を読み取ってください");
addLog("カメラ起動");

scheduleScan();

} catch (error) {
console.error(error);
setStatus("起動できませんでした。");
startBtn.disabled = false;
if (stream) {
stream.getTracks().forEach(track => track.stop());
stream = null;
}
}
}

async function stopCamera() {
running = false;
if (timer) { clearTimeout(timer); timer = null; }
if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
video.srcObject = null;
if (worker) { try { await worker.terminate(); } catch(e){} worker = null; }

processing = false;
stopBtn.disabled = true;
startBtn.disabled = false;

setStatus("カメラ停止");
addLog("カメラ停止");
}

function scheduleScan() {
if (!running) return;
timer = setTimeout(async () => {
if (!running) return;
if (!processing) {
processing = true;
try { await scanFrame(); } catch (e) {} finally { processing = false; }
}
scheduleScan();
}, SCAN_INTERVAL);
}

async function scanFrame() {
if (!running || !worker || video.readyState < 2 || video.videoWidth === 0) return;

const vw = video.videoWidth;
const vh = video.videoHeight;
const sx = vw * 0.15;
const sy = vh * 0.40;
const sw = vw * 0.70;
const sh = vh * 0.20;

canvas.width = 1000;
canvas.height = 400;
ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

const result = await worker.recognize(canvas);
const code = normalizeCode(result.data.text || "");

if (!validCode(code)) {
handleNoRead();
return;
}

emptyCount = 0;
if (!referenceCode) { handleFirstLabel(code); return; }
if (!waitingForSecond) { setStatus("1枚目を外してください"); return; }
handleSecondLabel(code);
}

function handleNoRead() {
candidateCode = "";
candidateCount = 0;
if (!referenceCode) { setStatus("品番を緑枠に合わせてください"); return; }

if (!waitingForSecond) {
emptyCount++;
if (emptyCount >= REQUIRED_EMPTY_COUNT) {
waitingForSecond = true;
secondCandidate = "";
secondCount = 0;
currentCode = "";
currentEl.textContent = "未読み取り";
showResult("waiting", "2枚目を待っています");
setStatus("2枚目を合わせてください");
addLog("1枚目が外されました");
} else {
setStatus("1枚目を外してください");
}
} else {
secondCandidate = "";
secondCount = 0;
setStatus("2枚目を緑枠に合わせてください");
}
}

function handleFirstLabel(code) {
if (candidateCode === code) { candidateCount++; }
else { candidateCode = code; candidateCount = 1; }

setStatus("1枚目読取中... " + candidateCount + "/" + REQUIRED_COUNT);

if (candidateCount >= REQUIRED_COUNT) {
referenceCode = code;
referenceEl.textContent = referenceCode;
clearCandidates();
emptyCount = 0;
waitingForSecond = false;

showResult("waiting", "1枚目登録完了");
setStatus("1枚目を外してください");
addLog("基準登録: " + referenceCode);
}
}

function handleSecondLabel(code) {
if (secondCandidate === code) { secondCount++; }
else { secondCandidate = code; secondCount = 1; }

setStatus("2枚目読取中... " + secondCount + "/" + REQUIRED_COUNT);
if (secondCount < REQUIRED_COUNT) return;

currentCode = code;
currentEl.textContent = currentCode;

if (currentCode === referenceCode) {
showResult("match", "⭕ 一致");
setStatus("照合完了：一致しました");
addLog("一致: " + currentCode);
} else {
showResult("mismatch", "❌ 不一致");
setStatus("照合完了：不一致です");
addLog("不一致: 基準=" + referenceCode + " / 読取=" + currentCode);
}

waitingForSecond = false;
emptyCount = 0;
secondCandidate = "";
secondCount = 0;
}

startBtn.addEventListener("click", startCamera);
stopBtn.addEventListener("click", stopCamera);
resetBtn.addEventListener("click", resetAll);

window.addEventListener("pagehide", () => {
running = false;
if (timer) clearTimeout(timer);
if (stream) stream.getTracks().forEach(t => t.stop());
if (worker) worker.terminate();
});
</script>

</body>
</html>
